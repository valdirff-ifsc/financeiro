<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VC Finanças</title>
    <meta
      name="description"
      content="Sistema pessoal de controle financeiro com dashboard, cartões, contas, despesas, mercado, dívidas, receitas e investimentos."
    />
    <meta name="theme-color" content="#f3f0e8" />
    <meta name="application-name" content="VC Finanças" />
    <meta name="apple-mobile-web-app-title" content="VC Finanças" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png?v=14" />
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png?v=14" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <img class="brand-mark" src="/assets/icons/icon-192.png?v=14" alt="Monograma VC" />
          <div>
            <strong>VC Finanças</strong>
            <span>casa &amp; futuro</span>
          </div>
          <button class="icon-button mobile-only sidebar-close" id="sidebarClose" type="button" aria-label="Fechar menu">
            <i data-lucide="x"></i>
          </button>
        </div>
        <nav class="nav-list" id="sidebarNav" aria-label="Navegação principal"></nav>
      </aside>
      <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Fechar menu"></button>

      <div class="main-shell">
        <header class="topbar">
          <button class="icon-button mobile-only" id="menuToggle" type="button" aria-label="Abrir menu" aria-expanded="false">
            <i data-lucide="menu"></i>
          </button>

          <div class="page-heading">
            <span id="pageEyebrow">Sistema financeiro pessoal</span>
            <h1 id="pageTitle">Dashboard</h1>
          </div>

          <div class="topbar-actions month-toolbar" aria-label="Controle do mês analisado">
            <button class="icon-button month-nav" id="monthPrev" type="button" aria-label="Mês anterior">
              <i data-lucide="chevron-left"></i>
            </button>

            <div class="month-control">
              <span>Mês em análise</span>
              <div class="month-fields">
                <select id="monthSelect" aria-label="Mês"></select>
                <input id="yearInput" type="number" min="2000" max="2100" aria-label="Ano" />
              </div>
            </div>

            <button class="icon-button month-nav" id="monthNext" type="button" aria-label="Próximo mês">
              <i data-lucide="chevron-right"></i>
            </button>

            <button class="button secondary month-today" id="monthToday" type="button">
              <i data-lucide="calendar-check"></i>
              <span>Este mês</span>
            </button>
          </div>
        </header>

        <main class="content" id="appRoot" tabindex="-1"></main>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <div id="modalRoot"></div>
    <dialog class="confirm-dialog" id="confirmDialog"></dialog>

    <script type="module" src="src/app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          const localDevelopment = ["localhost", "127.0.0.1"].includes(window.location.hostname);
          if (localDevelopment) {
            Promise.all([
              navigator.serviceWorker.getRegistrations().then((registrations) =>
                Promise.all(registrations.map((registration) => registration.unregister())),
              ),
              caches.keys().then((keys) =>
                Promise.all(keys.filter((key) => /^(financeiro-pwa|vc-financas)-/.test(key)).map((key) => caches.delete(key))),
              ),
            ]).then(() => {
              if (navigator.serviceWorker.controller && !sessionStorage.getItem("vc-local-sw-cleared")) {
                sessionStorage.setItem("vc-local-sw-cleared", "1");
                window.location.reload();
                return;
              }
              sessionStorage.removeItem("vc-local-sw-cleared");
            });
            return;
          }
          navigator.serviceWorker.register("/sw.js").catch((error) => {
            console.warn("Service worker não registrado.", error);
          });
        });
      }
    </script>
  </body>
</html>
